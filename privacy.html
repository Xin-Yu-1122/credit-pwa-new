<h1>隱私權政策</h1>
<p>「信用卡記帳」是個人使用的記帳工具。</p>
<ul>
  <li>本應用程式透過 Google 登入，僅存取你指定的 Google 試算表，用來讀取與寫入你的記帳資料。</li>
  <li>記帳資料只儲存在你自己的 Google 試算表，以及你裝置瀏覽器的本機快取中。</li>
  <li>登入憑證僅用於向 Google 換取存取權限，不會儲存在任何第三方伺服器，也不會用於其他用途。</li>
  <li>本應用程式不會收集、出售或分享你的任何資料給第三方。</li>
  <li>你可以隨時到 <a href="https://myaccount.google.com/permissions">Google 帳戶的第三方存取權</a> 頁面撤銷授權。</li>
</ul>
